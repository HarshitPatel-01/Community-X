services:
  - type: web
    name: toxic-model
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r Toxic_Model/requirements.txt
    startCommand: uvicorn Toxic_Model.roberta_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PORT
        value: 10000
